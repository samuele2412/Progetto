# Local development: just the database.
#
#   docker compose -f docker-compose.dev.yml up -d
#   npm run db:migrate && npm run db:seed && npm run admin:create
#   npm run dev
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cordiale
      POSTGRES_PASSWORD: cordiale
      POSTGRES_DB: cordiale
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cordiale -d cordiale']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dev-db-data:
